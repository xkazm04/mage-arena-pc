<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>A10 directional motion review</title>
<style>html,body{margin:0;background:#101922;color:#efe8d8;font:16px Georgia}header{position:fixed;z-index:2;top:0;left:0;right:0;background:#101922e8;padding:12px;display:flex;gap:12px;flex-wrap:wrap}select,button{font:inherit;background:#253840;color:inherit;border:1px solid #82918e;padding:5px}canvas{display:block;width:100vw;height:100vh}a{color:#a9d8df}</style>
<header><a href="index.html">A10 owner board</a><label>State <select id="state"><option>run</option><option>idle</option><option>cast</option><option>absorb</option><option>hit</option><option>death</option></select></label><label>Body height <select id="scale"><option value=".03">3%</option><option value=".0375" selected>3.75%</option><option value=".045">4.5%</option></select></label><label>Floor <select id="palette"><option>verdigris</option><option>rust-sand</option><option>moonlit</option></select></label><button id="pause">Pause</button><span id="status">Loading reviewed assets…</span></header><canvas></canvas>
<script type="module">
import {loadCharacters,drawCharacter,facingFromVelocity,bodyFrameAt} from '../../delivery/a10/canvas-loader.js';
const root=new URL('../../../',location.href), art=await loadCharacters(root), canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const state=document.querySelector('#state'),scale=document.querySelector('#scale'),palette=document.querySelector('#palette');
const grounds=new Map();for(const p of ['verdigris','rust-sand','moonlit']){const img=new Image();img.src=new URL(`art/delivery/a9/ground/${p}.png`,root);await img.decode();grounds.set(p,img)}
const entities=['cassia','brennic','garran','iskar','conscript','shieldman','slinger','netter','cinder_hound','mire_maw','thornback','hush_moth'];let time=0,last=performance.now(),paused=false;
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Play':'Pause'};
state.onchange=()=>{time=0};
const directions=['ne','se','sw','nw'];
window.__loaderChecks={fourVelocityDirections:[facingFromVelocity(1,-1),facingFromVelocity(1,1),facingFromVelocity(-1,1),facingFromVelocity(-1,-1)].join()==directions.join(),stationaryRetains:facingFromVelocity(0,0,'ne')==='ne',axisRetainsOtherComponent:facingFromVelocity(0,-1,'sw')==='nw',missingIsNull:bodyFrameAt(null,0)===null};
function draw(now){if(!paused)time+=Math.min(now-last,60);last=now;window.__artTime=time;
 canvas.width=innerWidth;canvas.height=innerHeight;const w=canvas.width,h=canvas.height,s=h/1080*Number(scale.value)/.0375;
 ctx.fillStyle=ctx.createPattern(grounds.get(palette.value),'repeat');ctx.fillRect(0,0,w,h);ctx.fillStyle='#08111b88';ctx.fillRect(0,0,w,h);
 let missing=0,drawn=0;const cellw=w/4,cellh=(h-100)/3;
 for(let i=0;i<entities.length;i++){for(let di=0;di<4;di++){const x=(i%4+.5)*cellw+(di-1.5)*cellw*.2,y=110+(Math.floor(i/4)+.55)*cellh;const direction=directions[di];
   const move=state.value==='run'?((time%2400)/2400-.5)*cellw*.12:0;const dx=direction[1]==='e'?move:-move,dy=direction[0]==='s'?move:-move;
   ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(x+dx,y+dy,15*s,4*s,0,0,Math.PI*2);ctx.fill();
   const clip=art.manifest.entities[entities[i]]?.clips[state.value]?.[direction];const duration=clip?.frames.reduce((sum,f)=>sum+f.durationMs,0)||1;
   if(!drawCharacter(ctx,art,entities[i],state.value,direction,clip?.loop?time:time%(duration+450),x+dx,y+dy,s))missing++;else drawn++;
   ctx.font=`${Math.max(12,14*h/1080)}px Georgia`;ctx.textAlign='center';ctx.fillStyle='#f0e8d7';ctx.fillText(direction,x,y+42*s);
 }ctx.fillText(entities[i],(i%4+.5)*cellw,110+(Math.floor(i/4)+.55)*cellh+70*s)}
 window.__drawnCount=drawn;document.querySelector('#status').textContent=`${entities.length} candidates · ${missing} missing current clips · standalone art playback`;
 requestAnimationFrame(draw)}
window.__artReady=true;requestAnimationFrame(draw);
</script></html>
