<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Castra Clausa</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172832;color:#38291e;font-family:'Segoe UI',sans-serif}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:4px solid #8ad4dd;outline-offset:3px}header{height:108px;padding:18px 30px;background:#f3e7c7;border-bottom:6px solid #b48b47;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-family:Georgia,serif;font-weight:500;font-size:36px;letter-spacing:.02em;margin:0}header p{margin:5px 0 0;font-size:15px;letter-spacing:.13em}nav{display:flex;gap:12px}nav button{min-width:112px;min-height:50px;background:transparent;border:2px solid #38291e;border-radius:3px;color:#38291e;font-weight:700;font-size:18px}nav button[aria-pressed=true]{background:#236d84;color:#fff3d5;border-color:#236d84}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;padding:20px;align-items:start}.map{position:relative;aspect-ratio:16/9;overflow:hidden;border:3px solid #b48b47;background:#172832}.map>img{display:block;width:100%;height:100%;object-fit:contain}.shade{position:absolute;inset:0;pointer-events:none}.paths{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.pin{position:absolute;transform:translate(-50%,-50%);padding:8px 12px;min-height:48px;min-width:128px;background:#f3e7c7;border:2px solid #38291e;border-radius:3px;color:#38291e;box-shadow:0 2px 2px #38291e55}.pin strong{display:block;font-size:17px}.pin small{display:block;margin-top:2px;font-size:13px}.pin[aria-pressed=true]{border:3px solid #236d84;background:#fff4d7}.pin:disabled{background:#d7c9a7;color:#584a3b;border-style:dashed;cursor:default}.pin:disabled small{font-weight:700}.side{background:#f3e7c7;padding:18px;border:3px solid #b48b47}.side h2{font-family:Georgia,serif;font-size:27px;margin:0 0 8px}.side p{line-height:1.5;font-size:16px}.place-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.place-list button{padding:9px;text-align:left;min-height:44px;background:#e7dab6;border:1px solid #917951;border-radius:2px;color:#38291e;font-size:16px}.place-list button span{display:block;font-size:12px;margin-top:2px}.place-list button[aria-pressed=true]{border:2px solid #236d84;background:#fff4d7}.place-list button:disabled{opacity:.7;cursor:default;border-style:dashed}.enter{background:#236d84;color:#fff4d7;min-height:48px;border:0;width:100%;margin:10px 0 15px;font-weight:700}.place-art{width:100%;display:block;margin-top:14px;border:1px solid #917951}.foot{color:#f3e7c7;padding:0 24px 16px;font-size:15px;display:flex;justify-content:space-between;gap:12px}.foot a{color:#f3e7c7}.lamp{position:absolute;width:7px;height:7px;background:#ffd994;border-radius:50%;box-shadow:0 0 12px 5px #efb75480;pointer-events:none;display:none}.map[data-slot=night] .lamp{display:block}dialog{padding:0;border:3px solid #b48b47;background:#f3e7c7;color:#38291e;width:min(1160px,94vw);max-height:94vh}dialog::backdrop{background:#0b171fe6}.scene{display:block;width:100%}.dialog-copy{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}.dialog-copy h2{margin:0;font-family:Georgia,serif;font-size:28px}.dialog-copy p{margin:6px 0}.close{min-height:44px;padding:8px 24px;border:2px solid #38291e;background:transparent;color:#38291e;font-weight:700}
@media(min-width:2200px){header{height:144px;padding:24px 40px}h1{font-size:48px}.layout{grid-template-columns:minmax(0,1fr) 380px;gap:26px;padding:26px}.pin{padding:10px 16px;min-height:64px;min-width:170px}.pin strong{font-size:23px}.pin small{font-size:17px}.side{padding:24px}.side h2{font-size:36px}.side p,.place-list button{font-size:21px}.place-list button{min-height:58px}.place-list button span{font-size:16px}.foot{font-size:20px}.enter{min-height:64px;font-size:20px}}
@media(max-width:1000px){header{height:auto;align-items:flex-start;flex-direction:column;padding:18px}h1{font-size:30px}nav{width:100%}nav button{min-width:0;flex:1}.layout{grid-template-columns:1fr;padding:12px;gap:12px}.pin{display:none}.place-list{grid-template-columns:repeat(2,minmax(0,1fr))}.side{padding:16px}.place-art{max-height:240px;object-fit:cover}.foot{flex-direction:column;padding:4px 16px 20px}.dialog-copy{padding:12px;align-items:flex-start}.dialog-copy h2{font-size:23px}.close{padding:8px 12px}}
</style>
<header><div><h1>Castra Clausa</h1><p>SEASON / BEFORE THE GAMES</p></div><nav aria-label="Time of day"><button data-slot="day">Day</button><button data-slot="dusk">Dusk</button><button data-slot="night">Night</button></nav></header>
<main class="layout"><div class="map" data-slot="day"><img src="../../review/sources/01-tessera-camp-a01.jpg" alt="Guarded camp with eight places, a dry cistern, patched tents and a closed grille"><div class="shade"></div><svg class="paths" viewBox="0 0 1280 720" aria-hidden="true"></svg><div class="pins"></div></div><aside class="side"><h2 id="place-title"></h2><p id="place-copy"></p><p id="place-open"></p><button class="enter">Visit</button><div class="place-list" aria-label="Places"></div><img class="place-art" alt="Selected place"></aside></main>
<footer class="foot"><span id="slot-note"></span><span><a href="hollow-board.html">The Hollow Board</a> · <a href="../../review/a4/index.html">Art review</a></span></footer>
<dialog><img class="scene" alt="Camp place backdrop"><div class="dialog-copy"><div><h2></h2><p></p></div><button class="close">Return to camp</button></div></dialog>
<script>
const DATA=__DATA__;
let slot='day', selected='yard';
const title=s=>s.charAt(0).toUpperCase()+s.slice(1), map=document.querySelector('.map');
function select(id){const p=DATA.places.find(p=>p.id===id);if(!p.open.includes(slot))return;selected=id;render()}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.slot===slot));
 map.dataset.slot=slot;document.querySelector('.shade').style.background=DATA.overlays[slot];
 document.querySelector('.pins').replaceChildren();document.querySelector('.place-list').replaceChildren();
 const svg=document.querySelector('.paths');svg.replaceChildren();
 DATA.places.forEach(p=>{
  const open=p.open.includes(slot), a=DATA.anchors[p.id], xy=DATA.labels[p.id], label=title(p.name), state=open?'Open now':'Opens: '+p.open.map(title).join(' / ');
  const line=document.createElementNS('http://www.w3.org/2000/svg','line');Object.entries({x1:a[0]*1280,y1:a[1]*720,x2:xy[0]*1280,y2:xy[1]*720,stroke:'#f3e7c7','stroke-width':2}).forEach(([k,v])=>line.setAttribute(k,v));svg.append(line);
  const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');Object.entries({cx:a[0]*1280,cy:a[1]*720,r:4,fill:open?'#236d84':'#b48b47',stroke:'#fff4d7','stroke-width':2}).forEach(([k,v])=>dot.setAttribute(k,v));svg.append(dot);
  const pin=document.createElement('button');pin.className='pin';pin.dataset.place=p.id;pin.disabled=!open;pin.setAttribute('aria-pressed',selected===p.id);pin.style.left=xy[0]*100+'%';pin.style.top=xy[1]*100+'%';const strong=document.createElement('strong');strong.textContent=label;const small=document.createElement('small');small.textContent=state;pin.append(strong,small);pin.onclick=()=>select(p.id);document.querySelector('.pins').append(pin);
  const button=document.createElement('button');button.dataset.place=p.id;button.disabled=!open;button.setAttribute('aria-pressed',selected===p.id);button.textContent=label;const meta=document.createElement('span');meta.textContent=state;button.append(meta);button.onclick=()=>select(p.id);document.querySelector('.place-list').append(button);
 });
 const p=DATA.places.find(p=>p.id===selected);document.querySelector('#place-title').textContent=title(p.name);document.querySelector('#place-copy').textContent=p.copy;document.querySelector('#place-open').textContent='Available: '+p.open.map(title).join(' / ');document.querySelector('.place-art').src='backdrops/'+p.id+'.jpg';
 document.querySelector('#slot-note').textContent={day:'Day · choose a place inside the wards.',dusk:'Dusk · the Pit opens; the Exchange and Door close.',night:'Night · return to your tent or approach the fog edge.'}[slot];
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{slot=b.dataset.slot;if(!DATA.places.find(p=>p.id===selected).open.includes(slot))selected=DATA.places.find(p=>p.open.includes(slot)).id;render()});
document.querySelector('.enter').onclick=()=>{const p=DATA.places.find(p=>p.id===selected), d=document.querySelector('dialog');d.querySelector('.scene').src='backdrops/'+p.id+'.jpg';d.querySelector('h2').textContent=title(p.name);d.querySelector('p').textContent=p.copy;d.showModal()};document.querySelector('.close').onclick=()=>document.querySelector('dialog').close();
[[.26,.34],[.54,.59],[.85,.82]].forEach(([x,y])=>{const d=document.createElement('i');d.className='lamp';d.style.left=x*100+'%';d.style.top=y*100+'%';map.append(d)});
window.campState=()=>({slot,selected,open:DATA.places.filter(p=>p.open.includes(slot)).map(p=>p.id)});render();
</script></html>
