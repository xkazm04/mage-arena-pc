<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1218">
<title>Mage Arena controller</title>
<!-- Served by the TV shell (tv/app PadLink) from APK assets; the shell replaces the TUNING marker below with the "phone"
     block of tv/controller/tuning.json. Absolute state goes to the TV about 60 times a second while a thumb is down and
     4 times a second otherwise, so a lost or late frame heals with the next one. -->
<style>
:root{--bg:#0b1218;--panel:#15202a;--line:#2c3b47;--ink:#f4ead2;--muted:#9fb0b8;--gold:#e0b860;--water:#5ab8e8;--ward:#7fd0c8;--danger:#ff8a6a;--ok:#5fd08a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif;touch-action:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:76px 1fr;gap:6px;padding:4px 10px 10px}
header{display:flex;align-items:center;gap:6px;min-width:0}
.status{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
.status span{overflow:hidden;text-overflow:ellipsis}
.dot{width:12px;height:12px;border-radius:50%;background:var(--danger);flex:none}
body.online .dot{background:var(--ok)}
button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:14px;touch-action:none;min-width:72px;min-height:72px;font-weight:800;letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
button small{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.12em}
button.held{background:#2c4150;border-color:var(--gold)}
header button{height:72px;width:84px;font-size:13px}
.slots{display:flex;gap:6px}
.slots button{width:72px;font-size:26px}
.slots button.on{border-color:var(--gold);color:var(--gold)}
main{position:relative;min-height:0}
section{position:absolute;inset:0;display:none}
body[data-mode=arena] #arena,body[data-mode=menu] #menu{display:grid}
body[data-mode=menu] .slots{visibility:hidden}
#arena{grid-template-columns:1fr 1fr 132px;gap:8px}
.zone{position:relative;border:2px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#14212b,#0f1920);overflow:hidden;touch-action:none}
.zone .name{position:absolute;left:14px;top:10px;font-size:12px;letter-spacing:.18em;color:var(--muted);font-weight:800;pointer-events:none}
.zone .hint{position:absolute;left:8px;right:8px;bottom:8px;text-align:center;font-size:11px;letter-spacing:.1em;color:var(--muted);pointer-events:none}
.stick{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;opacity:.35;transition:opacity .12s}
.zone.active .stick{opacity:1;transition:none}
.ring{position:absolute;border-radius:50%;border:3px solid var(--ink)}
.knob{position:absolute;width:56px;height:56px;left:-28px;top:-28px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px #0008}
.ring.sprint{border-style:dashed;opacity:.45}
.zone.sprinting .ring.sprint{opacity:1;border-color:var(--gold);border-width:5px}
.ring.cast{border-color:var(--water);opacity:.55}
.zone.casting .ring.cast{opacity:1;border-width:6px}
.zone.casting .knob{background:var(--water)}
.actions{display:grid;grid-template-rows:1fr 1fr;gap:8px}
.ward{background:#163330;border-color:#3f8f86;font-size:21px}
.ward.held{background:var(--ward);color:#082220}
.roll{background:#2b2616;border-color:#9a7d3b;font-size:21px}
.roll.held{background:var(--gold);color:#201a08}
#menu{grid-template-columns:1fr 1fr;gap:8px}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;place-self:center;height:100%;max-height:300px;aspect-ratio:1}
.dpad button{font-size:30px}
.dpad .up{grid-area:1/2}.dpad .left{grid-area:2/1}.dpad .right{grid-area:2/3}.dpad .down{grid-area:3/2}
.face{position:relative}
.face button{position:absolute;border-radius:50%}
.face .a{right:6%;bottom:4%;width:150px;height:150px;background:#1d3a26;border-color:var(--ok);font-size:36px}
.face .b{right:calc(6% + 162px);top:2%;width:112px;height:112px;background:#3a1f1f;border-color:var(--danger);font-size:28px}
.face .a.held{background:var(--ok);color:#06200f}.face .b.held{background:var(--danger);color:#2a0c05}
.modal{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#0b1218f2}
.modal[hidden]{display:none}
.card{width:min(440px,92vw);text-align:center}
.card h1{margin:0 0 10px;font-size:26px}
.card p{color:var(--muted);line-height:1.45;margin:8px 0 16px}
.card form{display:flex;gap:10px;justify-content:center}
.card input{width:150px;background:var(--panel);border:2px solid var(--line);border-radius:12px;color:var(--ink);font:700 30px system-ui;letter-spacing:.25em;text-align:center;padding:12px;user-select:text;-webkit-user-select:text}
.card button{display:inline-flex;padding:0 22px;background:var(--gold);border-color:var(--gold);color:#201a08;margin:0 auto}
.rotate{display:none}
@media (orientation:portrait){.rotate{display:flex;position:fixed;inset:0;z-index:9;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg);text-align:center;padding:30px}.rotate b{font-size:30px;color:var(--gold)}.rotate p{color:var(--muted)}}
@media (max-width:760px){header button{width:72px}.slots button{width:64px;min-width:64px}}
</style></head>
<body data-mode="menu">
<div class="app">
  <header>
    <div class="status"><i class="dot"></i><span id="status">Connecting…</span></div>
    <button id="pause" data-btn="9">PAUSE<small>START</small></button>
    <button id="modeToggle">ARENA<small>LAYOUT</small></button>
    <div class="slots">
      <button id="slot1" data-key="Digit1">1</button><button id="slot2" data-key="Digit2">2</button>
      <button id="slot3" data-key="Digit3">3</button><button id="slot4" data-key="Digit4">4</button>
    </div>
  </header>
  <main>
    <section id="arena">
      <div class="zone" id="moveZone"><b class="name">MOVE</b>
        <div class="stick"><div class="ring sprint"></div><div class="ring base"></div><div class="knob"></div></div>
        <span class="hint">PAST THE DASHED RING: SPRINT</span></div>
      <div class="zone" id="aimZone"><b class="name">AIM</b>
        <div class="stick"><div class="ring base"></div><div class="ring cast"></div><div class="knob"></div></div>
        <span class="hint">PUSH TO THE BLUE RING: CAST</span></div>
      <div class="actions">
        <button class="ward" id="ward" data-btn="6">WARD<small>HOLD</small></button>
        <button class="roll" id="roll" data-btn="0">ROLL<small>TAP</small></button>
      </div>
    </section>
    <section id="menu">
      <div class="dpad">
        <button class="up" id="up" data-btn="12">&#9650;</button><button class="left" id="left" data-btn="14">&#9664;</button>
        <button class="right" id="right" data-btn="15">&#9654;</button><button class="down" id="down" data-btn="13">&#9660;</button>
      </div>
      <div class="face">
        <button class="b" id="b" data-btn="1">B<small>BACK</small></button>
        <button class="a" id="a" data-btn="0">A<small>OK</small></button>
      </div>
    </section>
  </main>
</div>
<div class="modal" id="pair" hidden><div class="card"><h1>TV code</h1><p id="pairMessage">Enter the 4 digits shown on the TV.</p>
  <form id="pairForm"><input id="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" aria-label="TV code" required><button>JOIN</button></form></div></div>
<div class="modal" id="notice" hidden><div class="card"><h1 id="noticeTitle">Seat taken</h1><p id="noticeMessage"></p><button id="retry">RETRY</button></div></div>
<div class="rotate"><b>Turn your phone sideways</b><p>Left thumb moves, right thumb aims and casts.</p></div>
<script>
(() => {
  'use strict';
  const T = /*TUNING*/{};
  const $ = id => document.getElementById(id);
  const store = { get: k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  const params = new URLSearchParams(location.search);
  let pin = params.get('pin') || store.get('magePin'), token = store.get('mageToken');
  let ws = null, ready = false, refused = false, retries = 0, retryTimer = 0, q = 0, lastSent = 0, lingerUntil = 0;
  let mode = 'menu', manual = false, screenName = '', activated = false;
  const buzz = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch {} };

  // ---- input state: held buttons (by standard-gamepad index) and the two floating sticks ----
  const held = new Map(), minUntil = new Map();
  const R = T.stickRadiusPx;
  const sticks = {
    move: { el: $('moveZone'), id: null, ox: 0, oy: 0, x: 0, y: 0, extra: false },
    aim: { el: $('aimZone'), id: null, ox: 0, oy: 0, x: 0, y: 0, extra: false }
  };
  for (const s of Object.values(sticks)) {
    const rings = s.el.querySelectorAll('.ring');
    for (const r of rings) {
      const k = r.classList.contains('sprint') ? T.sprintRing : r.classList.contains('cast') ? T.castOn : 1;
      Object.assign(r.style, { width: 2 * R * k + 'px', height: 2 * R * k + 'px', left: -R * k + 'px', top: -R * k + 'px' });
    }
  }
  function bits() {
    const now = performance.now();
    let b = 0;
    for (const [i, set] of held) if (set.size) b |= 1 << i;
    for (const [i, until] of minUntil) if (now < until) b |= 1 << i;
    if (sticks.aim.extra) b |= 1 << 7;   // RT: cast while the aim stick is past the cast ring
    if (sticks.move.extra) b |= 1 << 10; // L3: sprint while the move stick is past the dashed ring
    return b;
  }
  const r3 = v => Math.round(v * 1000) / 1000;
  function frame() {
    return '{"t":"i","q":' + q + ',"b":' + bits() + ',"x":[' + r3(sticks.move.x) + ',' + r3(sticks.move.y) + ',' + r3(sticks.aim.x) + ',' + r3(sticks.aim.y) + ']}';
  }

  // ---- sending: on every change, then ~60 Hz while anything is held, 4 Hz heartbeat otherwise ----
  const sent = new Map(), rtts = [], pings = [];
  function send() {
    if (!ready || !ws || ws.readyState !== 1) return;
    if (ws.bufferedAmount > 1024) return; // a stalled radio: drop, the next absolute frame replaces this one
    const now = performance.now();
    sent.set(q, now);
    if (sent.size > 240) sent.delete(sent.keys().next().value);
    ws.send(frame());
    q++;
    lastSent = now;
  }
  function changed() {
    lingerUntil = performance.now() + T.lingerMs;
    if (performance.now() - lastSent >= 8) send();
  }
  function busy() {
    const now = performance.now();
    if (now < lingerUntil || sticks.move.id !== null || sticks.aim.id !== null) return true;
    for (const set of held.values()) if (set.size) return true;
    for (const until of minUntil.values()) if (now < until + 20) return true;
    return false;
  }
  setInterval(() => { if (busy() || performance.now() - lastSent >= 1000 / T.idleHz) send(); }, 1000 / T.activeHz);

  // ---- sticks: the stick appears where the thumb lands ----
  function placeStick(s) {
    const st = s.el.querySelector('.stick'), r = s.el.getBoundingClientRect();
    if (s.id === null) { st.style.left = '50%'; st.style.top = '50%'; st.querySelector('.knob').style.transform = ''; return; }
    st.style.left = (s.ox - r.left) + 'px';
    st.style.top = (s.oy - r.top) + 'px';
  }
  function moveStick(name, s, cx, cy) {
    const dx = cx - s.ox, dy = cy - s.oy, d = Math.hypot(dx, dy), m = Math.min(1, d / R);
    s.x = d ? dx / d * m : 0;
    s.y = d ? dy / d * m : 0;
    const was = s.extra;
    if (name === 'move') s.extra = d > R * T.sprintRing;
    else s.extra = s.extra ? m >= T.castOff : m >= T.castOn;
    if (s.extra && !was) buzz(name === 'aim' ? T.vibrate.cast : T.vibrate.press);
    s.el.classList.toggle(name === 'move' ? 'sprinting' : 'casting', s.extra);
    const cap = R * (name === 'move' ? T.sprintRing : 1), k = d > cap ? cap / d : 1;
    s.el.querySelector('.knob').style.transform = 'translate(' + dx * k + 'px,' + dy * k + 'px)';
  }
  function releaseStick(name, s) {
    s.id = null; s.x = s.y = 0; s.extra = false;
    s.el.classList.remove('active', 'sprinting', 'casting');
    placeStick(s);
  }
  for (const [name, s] of Object.entries(sticks)) {
    s.el.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (s.id !== null) return;
      s.el.setPointerCapture(e.pointerId);
      s.id = e.pointerId; s.ox = e.clientX; s.oy = e.clientY;
      s.el.classList.add('active');
      placeStick(s);
      moveStick(name, s, e.clientX, e.clientY);
      changed();
    });
    s.el.addEventListener('pointermove', e => {
      if (s.id !== e.pointerId) return;
      moveStick(name, s, e.clientX, e.clientY);
      changed();
    });
    const end = e => { if (s.id !== e.pointerId) return; releaseStick(name, s); changed(); };
    for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) s.el.addEventListener(t, end);
  }

  // ---- buttons: held while a finger is on them, and for at least minPressMs so a quick tap spans a game frame ----
  for (const el of document.querySelectorAll('[data-btn]')) {
    const i = +el.dataset.btn;
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      if (!held.has(i)) held.set(i, new Set());
      held.get(i).add(e.pointerId);
      minUntil.set(i, performance.now() + T.minPressMs);
      el.classList.add('held');
      buzz(T.vibrate.press);
      changed();
    });
    const end = e => {
      const set = held.get(i);
      if (!set || !set.delete(e.pointerId)) return;
      if (!set.size) el.classList.remove('held');
      changed();
    };
    for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) el.addEventListener(t, end);
  }
  for (const el of document.querySelectorAll('[data-key]')) {
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (!ready) return;
      ws.send(JSON.stringify({ t: 'key', code: el.dataset.key }));
      for (const other of document.querySelectorAll('[data-key]')) other.classList.toggle('on', other === el);
      buzz(T.vibrate.press);
    });
  }
  /** Let go of everything: a mode switch, a hidden page or a lost link must never leave a stick or button down. */
  function neutral() {
    for (const [name, s] of Object.entries(sticks)) releaseStick(name, s);
    held.clear(); minUntil.clear();
    for (const el of document.querySelectorAll('.held')) el.classList.remove('held');
    send();
  }

  // ---- layout: arena (two sticks) or menu (D-pad, A, B), following the TV's screen unless overridden ----
  function setMode(m) {
    if (m === mode) return;
    neutral();
    mode = m;
    document.body.dataset.mode = m;
    $('modeToggle').firstChild.textContent = m === 'arena' ? 'MENU' : 'ARENA';
  }
  $('modeToggle').addEventListener('pointerdown', e => { e.preventDefault(); manual = true; setMode(mode === 'arena' ? 'menu' : 'arena'); buzz(T.vibrate.press); });

  // ---- link ----
  let statusText = '', online = false;
  function status(text, ok) {
    if (text !== statusText) { statusText = text; $('status').textContent = text; }
    if (ok !== online) { online = ok; document.body.classList.toggle('online', ok); }
  }
  function summary(list) {
    const a = list.slice().sort((x, y) => x - y), at = p => a.length ? Math.round(a[Math.min(a.length - 1, Math.round(p * (a.length - 1)))] * 10) / 10 : null;
    return { n: a.length, p50: at(0.5), p95: at(0.95), max: at(1) };
  }
  function keep(list, v) { list.push(v); if (list.length > T.samples) list.shift(); }
  function showPair(message) {
    $('pairMessage').textContent = message || 'Enter the 4 digits shown on the TV.';
    $('pair').hidden = false;
  }
  function connect() {
    clearTimeout(retryTimer);
    if (!pin && !token) { showPair(); return; }
    refused = false;
    status('Connecting to the TV…', false);
    ws = new WebSocket('ws://' + location.host + '/ws');
    ws.onopen = () => ws.send(JSON.stringify({ t: 'hello', pin, token }));
    ws.onmessage = e => {
      let m;
      try { m = JSON.parse(e.data); } catch { return; }
      const now = performance.now();
      if (m.t === 'welcome') {
        ready = true; retries = 0; token = m.token;
        store.set('mageToken', token); store.set('magePin', pin);
        $('pair').hidden = true; $('notice').hidden = true;
        status('Connected', true);
        buzz(T.vibrate.paired);
        send();
      } else if (m.t === 'error') {
        refused = true; ready = false;
        if (m.code === 'BAD_PIN') { token = ''; store.set('mageToken', ''); showPair(m.message); }
        else { $('noticeTitle').textContent = 'Seat taken'; $('noticeMessage').textContent = m.message; $('notice').hidden = false; }
        status(m.message, false);
      } else if (m.t === 'ack') {
        const at = sent.get(m.q);
        if (at !== undefined) keep(rtts, now - at);
        for (const k of sent.keys()) { if (k > m.q) break; sent.delete(k); }
      } else if (m.t === 'pong') {
        keep(pings, now - m.ts);
      } else if (m.t === 'screen') {
        if (m.s !== screenName) { screenName = m.s; manual = false; }
        if (!manual && m.s) setMode(m.s === 'arena' ? 'arena' : 'menu');
      }
    };
    ws.onclose = () => {
      const was = ready;
      ready = false;
      neutral();
      if (refused) return;
      if (was) buzz(T.vibrate.lost);
      status('Link lost · reconnecting…', false);
      if (!document.hidden) retryTimer = setTimeout(connect, T.reconnectMs[Math.min(retries++, T.reconnectMs.length - 1)]);
    };
  }
  setInterval(() => {
    if (ready && ws.readyState === 1) ws.send(JSON.stringify({ t: 'ping', ts: performance.now() }));
    if (ready) {
      const recent = summary(rtts.slice(-60));
      status('Connected' + (recent.n ? ' · ' + Math.round(recent.p50) + ' ms' : '') + (screenName ? ' · ' + screenName : ''), true);
    }
  }, T.pingMs);
  $('pairForm').addEventListener('submit', e => {
    e.preventDefault();
    pin = $('pin').value.trim(); token = '';
    $('pair').hidden = true;
    if (ws) { ws.onclose = null; ws.close(); }
    connect();
  });
  $('retry').addEventListener('click', () => { $('notice').hidden = true; connect(); });

  // ---- page lifecycle and optional browser features (all capability-detected) ----
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) neutral();
    else if (!ws || ws.readyState > 1) { if (!refused) connect(); }
  });
  window.addEventListener('blur', neutral);
  window.addEventListener('pagehide', () => { neutral(); if (ws) ws.close(); });
  document.addEventListener('contextmenu', e => e.preventDefault());
  // Fullscreen and the orientation lock need a user activation; ask on a release, never a press, because the viewport
  // resize can cancel touches that are still down (deathride). Screen wake lock needs a secure origin, which plain LAN
  // HTTP is not, so it is normally absent: keep the phone awake through its own display setting.
  document.addEventListener('pointerup', async () => {
    if (activated) return;
    activated = true;
    try { if (document.documentElement.requestFullscreen && !document.fullscreenElement) await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); } catch {}
    try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch {}
    try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch {}
  });

  // Test hooks for tools (Playwright): link timings and the state being sent.
  window.__ctrl = {
    stats: () => ({ ack: summary(rtts), ping: summary(pings), sent: q }),
    reset: () => { rtts.length = 0; pings.length = 0; },
    state: () => ({ ready, mode, manual, screen: screenName, bits: bits(), axes: [sticks.move.x, sticks.move.y, sticks.aim.x, sticks.aim.y], q })
  };
  connect();
})();
</script>
</body></html>
